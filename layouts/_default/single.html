{{ define "main" }}
<div class="page"><div class="wrap">
  <div class="page-head">
    {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
  <div class="prose{{ if .Params.story }} story{{ end }}{{ if .Params.wide }} wide{{ end }}">
    {{ .Content }}
  </div>
</div></div>
{{ end }}
